<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newton's Nerds – Questions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>Submit Your Questions</h1>
    <nav>
      <ul>
        <li><a href="{{ url_for('index') }}">Home</a></li>
        <li><a href="{{ url_for('questions_page') }}" class="active">Questions</a></li>
        <li><a href="{{ url_for('quiz_forms') }}">Quizzes</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Question submission form -->
    <section id="question-section">
      <form id="question-form">
        <label for="subject">Subject:</label>
        <select id="subject" name="subject" required>
          <option value="">Select Subject</option>
          <option value="Mathematics">Mathematics</option>
          <option value="Physics">Physics</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Biology">Biology</option>
        </select>

        <label for="question">Question:</label>
        <textarea id="question" name="question" rows="4" required></textarea>

        <label for="solution">Proposed Solution (optional):</label>
        <textarea id="solution" name="solution" rows="3"></textarea>

        <button type="submit">Submit Question</button>
      </form>

      <div id="form-message"></div>
    </section>

    <!-- Submitted questions list -->
    <section id="submitted-questions">
      <h2>Submitted Questions</h2>
      <ul id="questions-list">
        {% for q in questions %}
          <li>
            <strong>{{ q.subject }}:</strong> {{ q.question }}
            {% if q.solution %}
              <pre>{{ q.solution }}</pre>
            {% endif %}
            <button class="copy-btn" data-question="{{ q.question }}" data-solution="{{ q.solution|default('') }}">Copy</button>
          </li>
        {% endfor %}
      </ul>
    </section>
<!-- Notifications section -->
    <section id="notifications-section">
      <h2>Notifications</h2>
      <ul id="notifications-list"></ul>
    </section>
  </main>

  <script>
    // --- Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{{ url_for("static", filename="service-worker.js") }}')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.error('SW registration failed', err));
    }

    // --- Push Subscription ---
    async function subscribeUser() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

      const registration = await navigator.serviceWorker.ready;
      const res = await fetch('/vapid-public-key');
      const vapidPublicKey = await res.text();
      const convertedKey = urlBase64ToUint8Array(vapidPublicKey);

      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: convertedKey
      });

      await fetch('/save-subscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subscription)
      });
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    subscribeUser().catch(err => console.warn('Push subscription failed', err));

    // --- Submit Question ---
    const form = document.getElementById('question-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const subject = form.subject.value;
      const question = form.question.value;
      const solution = form.solution.value;

      const res = await fetch('{{ url_for("questions_page") }}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject, question, solution })
      });

      const data = await res.json();
      document.getElementById('form-message').textContent = data.message || 'Question submitted!';
      form.reset();
      loadQuestions();
    });

    // --- Load Submitted Questions ---
    async function loadQuestions() {
      const res = await fetch('{{ url_for("questions_page") }}?json=1');
      const data = await res.json();
      const list = document.getElementById('questions-list');
      list.innerHTML = '';
      data.questions.forEach(q => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${q.subject}:</strong> ${q.question}` +
          (q.solution ? `<pre>${q.solution}</pre>` : '') +
          `<button class="copy-btn" data-question="${q.question}" data-solution="${q.solution || ''}">Copy</button>`;
        list.appendChild(li);
      });
      attachCopyButtons();
    }

    // --- Copy Button ---
    function attachCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = `Q: ${btn.dataset.question}\n${btn.dataset.solution ? 'Solution: ' + btn.dataset.solution : ''}`;
          navigator.clipboard.writeText(text).then(() => alert('Copied!'));
        });
      });
    }

    // --- Fetch Notifications ---
    async function fetchNotifications() {
      const res = await fetch('/notifications/pending');
      const notifications = await res.json();
      const list = document.getElementById('notifications-list');
      list.innerHTML = '';
      notifications.forEach(n => {
        const li = document.createElement('li');
        li.textContent = `${n.subject}: ${n.message}`;
        list.appendChild(li);
      });
    }

    loadQuestions();
    attachCopyButtons();
    fetchNotifications();
    setInterval(fetchNotifications, 5000); // Refresh every 5s
  </script>
</body>
</html>
