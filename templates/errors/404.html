{% extends "base.html" %}
{% block title %}404 — Page not found{% endblock %}


{% block content %}
<div class="container text-center py-5">
<div class="display-1 fw-bold text-muted">404</div>
<h2 class="mt-3">Page not found</h2>
<p class="lead">We couldn't find the page you were looking for.</p>


<div class="mt-4">
<a class="btn btn-primary me-2" href="{{ url_for('home_page') }}">Go home</a>
<a class="btn btn-outline-secondary" href="javascript:history.back()">Go back</a>
</div>


<p class="mt-4 small text-muted">{{ message or '' }}</p>
</div>
{% endblock %}
