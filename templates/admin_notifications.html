<!doctype html>
<html>
<head>
  <title>Send Notifications</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <h1>Broadcast Push Notification</h1>
  <form id="notifyForm">
    <label>Admin Key: <input type="password" name="admin_key" required></label><br><br>

    <label>Title: <input type="text" name="title" required></label><br><br>
    <label>Message: <textarea name="body" rows="3" required></textarea></label><br><br>
    <label>URL to Open (optional): <input type="text" name="url"></label><br><br>
    <label>Icon Path (optional): <input type="text" name="icon"></label><br><br>
    <button type="submit">Send Notification</button>
  </form>

  <pre id="result"></pre>

  <script>
    document.getElementById("notifyForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const payload = {};
      formData.forEach((value, key) => payload[key] = value);

      const res = await fetch("/admin/send-notifications", {
        method: "POST",
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      document.getElementById("result").textContent = JSON.stringify(json, null, 2);
    });
  </script>
</body>
</html>
